---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-admin
  namespace: pihole
spec:
  refreshInterval: 1h0m0s

  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless

  target:
    name: pihole-admin
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: /pihole-admin