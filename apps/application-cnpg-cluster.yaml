---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: cnpg-system
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - FailOnSharedResource=true
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cluster
      targetRevision: 0.8.1
      helm:
        releaseName: cloudnative-pg
        valuesObject:
          cluster:
            podSecurityContext:
              fsGroupChangePolicy: 'OnRootMismatch'
            instances: 1
            imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.5-0.3.0
            roles:
              - name: immich
                login: true
                passwordSecret:
                  name: immich-pg-user
                connectionLimit: -1
                ensure: present
                inherit: true
              - name: sonarr
                login: true
                passwordSecret:
                  name: sonarr-pg-user
                connectionLimit: -1
                ensure: present
                inherit: true
              - name: radarr
                login: true
                passwordSecret:
                  name: radarr-pg-user
                connectionLimit: -1
                ensure: present
                inherit: true
              - name: prowlarr
                login: true
                passwordSecret:
                  name: prowlarr-pg-user
                connectionLimit: -1
                ensure: present
                inherit: true
            resources:
              requests:
                memory: 768Mi
                cpu: 200m
              limits:
                memory: 768Mi
            storage:
              size: 50Gi
              storageClass: nfs-csi
            walStorage:
              enabled: true
              size: 50Gi
              storageClass: nfs-csi
            postgresql:
              parameters:
                shared_buffers: 128MB
              shared_preload_libraries:
                # needed by immich
                - 'vchord.so'
            plugins:
              - name: barman-cloud.cloudnative-pg.io
                enabled: true
                isWALArchiver: true
          backups:
            enabled: true
            method: plugin
            provider: s3
            endpointURL: https://s3.fuochi.top
            destinationPath: s3://cnpg-backups/cluster
            secret:
              name: garage-cnpg-creds
              create: false
            retentionPolicy: '30d'
            wal:
              compression: gzip
              maxParallel: 1
            data:
              compression: gzip
              jobs: 1
              immediateCheckpoint: false
            # Because of https://github.com/cloudnative-pg/plugin-barman-cloud/pull/398
            # Required for Garage <= 1.0.1 (and several other S3-compatibles):
            # boto3 ≥ Jan 2025 defaults to streaming SHA256/CRC32 checksums,
            # which Garage cannot parse (treats "STREAMING-AWS4-..." as hex).
            # Track: https://git.deuxfleurs.fr/Deuxfleurs/garage/issues/824
            # Remove once Garage supports STREAMING-UNSIGNED-PAYLOAD-TRAILER.
            instanceSidecarConfiguration:
              env:
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
            pluginConfiguration:
              name: barman-cloud.cloudnative-pg.io
            scheduledBackups:
              - name: cnpg-weekly
                schedule: '0 0 3 * * 0' # Sun 03:00 UTC
                backupOwnerReference: self
                method: plugin
                pluginConfiguration:
                  name: barman-cloud.cloudnative-pg.io
    - repoURL: https://github.com/Fuochi/ignikube.git
      targetRevision: main
      path: apps/cnpg-databases
